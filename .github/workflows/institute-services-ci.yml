name: Institute services CI

# The seven Institute microservices + shared library + gateway. Everything runs against in-memory SQLite or throwaway containers
# on localhost; no repository secrets, no deployment, no production database.

on:
  pull_request:
    paths: ["backend/institute-*/**", "scripts/**", "docker-compose.yml", ".github/workflows/institute-services-ci.yml"]
  push:
    branches: [dev, QA, main, "feature/institute-portal"]
    paths: ["backend/institute-*/**", "scripts/**", "docker-compose.yml", ".github/workflows/institute-services-ci.yml"]

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/institute-common/requirements.txt
      - run: pip install -r backend/institute-common/requirements.txt fakeredis pytest openpyxl pillow ruff pip-audit && pip install --no-deps -e backend/institute-common
      - name: Lint
        run: ruff check backend/institute-common backend/institute-*-service backend/institute-integration-tests
      - name: Cross-service integration suite (all seven services behind the gateway router, SQLite + fake Redis)
        working-directory: backend/institute-integration-tests
        run: pytest -q
      - name: Gateway configuration is up to date with the services' routes
        run: python scripts/gen_gateway_conf.py --check
      - name: Dependency vulnerability scan
        run: pip-audit -r backend/institute-common/requirements.txt

  postgres:
    # Service migration chains vs the legacy chain on a real throwaway PostgreSQL (fresh install, adoption of an existing schema,
    # alembic check per service) and the integration suite on PostgreSQL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGBASE: postgresql+psycopg://postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Install
        run: |
          pip install -r backend/institute-common/requirements.txt fakeredis pytest openpyxl pillow
          pip install --no-deps -e backend/institute-common
          pip install -r backend/institute-backend/requirements-dev.txt
          for s in student-enrollment-service student-test-service student-attempt-service student-result-service student-notification-service; do
            pip install -r backend/$s/requirements.txt
          done
      - name: Verify migrations and run the integration suite on PostgreSQL
        run: scripts/verify-institute-services-on-postgres.sh

  images:
    # Build only (never pushed): every Dockerfile must produce an image.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, organization, academics, enrollment, paper, exam, operations]
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f backend/institute-${{ matrix.service }}-service/Dockerfile -t institute-${{ matrix.service }}-service:ci backend
  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t institute-gateway:ci backend/institute-gateway
      - name: nginx accepts the generated configuration
        run: docker run --rm --add-host institute-identity-service:127.0.0.1 --add-host institute-organization-service:127.0.0.1 --add-host institute-academics-service:127.0.0.1 --add-host institute-enrollment-service:127.0.0.1 --add-host institute-paper-service:127.0.0.1 --add-host institute-exam-service:127.0.0.1 --add-host institute-operations-service:127.0.0.1 institute-gateway:ci nginx -t
