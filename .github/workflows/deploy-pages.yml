name: Deploy Student Portal (GitHub Pages, disabled)

# DISABLED: this published the Student frontend to GitHub Pages without any API base URL, so the deployed site could not
# reach a backend. Both portals are now built and deployed by cloudflare-pages-demo.yml. The file is kept (not deleted)
# so history and the previous behaviour stay visible; to re-enable it, restore the push trigger and remove the two
# `if: ${{ false }}` lines (scripts/check_workflow_triggers.py then enforces the Student-only path filter again).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ false }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: student-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: student-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Configure SPA fallback
        run: cp dist/index.html dist/404.html 

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: student-frontend/dist

  deploy:
    needs: build
    if: ${{ false }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4