name: Institute backend CI

on:
  pull_request:
    paths: ["institute-backend/legacy-monolith/**", "student-backend/**", "scripts/**", "tests/**", ".github/workflows/institute-backend-ci.yml", "docs/institute-portal/**"]
  push:
    branches: [dev, QA, main, "feature/institute-portal"]
    paths: ["institute-backend/legacy-monolith/**", "student-backend/**", "scripts/**", "tests/**", ".github/workflows/institute-backend-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: institute-backend/legacy-monolith
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: institute-backend/legacy-monolith/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff pip-audit
      - name: Lint
        run: ruff check app tests
      - name: Tests (SQLite + fake Redis; never a real database)
        run: pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  postgres:
    # The whole Institute suite on a REAL (throwaway) PostgreSQL: triggers, foreign keys, INET, TIMESTAMPTZ, the Student chains
    # then the Institute chain, `alembic check`, and the re-evaluation SQL parity test. The database lives and dies with this job.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: inst_verify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGURL: postgresql+psycopg://postgres@127.0.0.1:5432/inst_verify
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Install (Institute + the Student services whose migrations are replayed)
        run: |
          pip install -r institute-backend/legacy-monolith/requirements-dev.txt pytest httpx
          for s in student-enrollment-service student-test-service student-attempt-service student-result-service student-notification-service; do
            pip install -r student-backend/$s/requirements.txt
          done
      - name: Verify migrations and run the suite on PostgreSQL
        run: scripts/verify-institute-on-postgres.sh

  guards:
    # Pipeline guarantees: the Student Pages deployment is path-filtered, no Institute/Student CI file deploys, references a
    # repository secret or a non-local database, and no tracked file contains a secret or an env file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/check_workflow_triggers.py
      - run: ./scripts/check-no-secrets.sh
