server {
    listen 80;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /auth          { proxy_pass http://student-authentication-service:8000; }
    location /profile       { proxy_pass http://student-profile-service:8001; }
    location /enrollments   { proxy_pass http://student-enrollment-service:8001; }
    location /attempts      { proxy_pass http://student-attempt-service:8001; }
    location /ranking       { proxy_pass http://student-ranking-service:8001; }
    location /notifications { proxy_pass http://student-notification-service:8001; }
    
    # Pass exactly as requested. No rewrites, no trailing slashes added.
    location /results       { proxy_pass http://student-result-service:8001; }
    location /tests         { proxy_pass http://student-test-service:8001; }

    # $http_host keeps the :8011 port in the Location header if FastAPI redirects
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}