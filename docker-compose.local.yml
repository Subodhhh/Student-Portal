# A fully LOCAL instance of the portal for development and demonstration, on top of docker-compose.yml (no change to it):
#
#   scripts/local-stack.sh up        build + start, migrate the local database, create demo logins (first run)
#   open http://localhost:18081      Institute Portal (its gateway: http://localhost:18010)
#   open http://localhost:18080      Student Portal
#
# Why an override: the base file's services read deploy/*/…env, which point at the shared Neon database, and use the live
# containers' names, images, ports and the demo edge network. Here every service instead
#   - reads deploy/local/*.local.env (git-ignored; created by scripts/local-stack.sh): a LOCAL PostgreSQL in this project only,
#   - runs as its own container (local-…), from its own image tag (portal-local/…), on its own ports (127.0.0.1 only),
# so it can run beside the live stack without touching it, its images or Neon. The legacy monolith and the tunnel are not part
# of this instance. Student Portal: http://localhost:18080 (its services on 127.0.0.1:18002-18009).
x-local-institute-env: &local_institute_env !override
  - {path: ./deploy/local/institute.local.env, required: true}
x-local-student-env: &local_student_env !override
  - {path: ./deploy/local/student.local.env, required: true}
x-local-net: &local_net !override [student-portal-network]
x-local-db: &local_db
  postgres: {condition: service_healthy}

services:
  postgres:
    image: postgres:18
    container_name: local-portal-postgres
    restart: unless-stopped
    env_file: [{path: ./deploy/local/postgres.local.env, required: true}]
    volumes: [portal-local-pgdata:/var/lib/postgresql]
    ports: ["127.0.0.1:55460:5432"]          # this machine only: migrations run from the repository (scripts/local-stack.sh)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [student-portal-network]

  redis:
    container_name: local-portal-redis
    ports: !reset []
    networks: !override
      student-portal-network:
        aliases: [student-auth-redis]          # the hostname every service's REDIS_URL uses

  student-authentication-service:
    image: portal-local/student-authentication-service:dev
    container_name: local-student-authentication-service
    env_file: *local_student_env
    ports: !override ["127.0.0.1:18002:8000"]     # the local Student portal calls it from the browser (live: 8002)
    networks: *local_net
    depends_on: *local_db
  student-profile-service:
    image: portal-local/student-profile-service:dev
    container_name: local-student-profile-service
    env_file: *local_student_env
    ports: !override ["127.0.0.1:18003:8001"]     # the local Student portal calls it from the browser (live: 8003)
    networks: *local_net
    depends_on: *local_db
  student-enrollment-service:
    image: portal-local/student-enrollment-service:dev
    container_name: local-student-enrollment-service
    env_file: *local_student_env
    ports: !override ["127.0.0.1:18004:8001"]     # the local Student portal calls it from the browser (live: 8004)
    networks: *local_net
    depends_on: *local_db
  student-test-service:
    image: portal-local/student-test-service:dev
    container_name: local-student-test-service
    env_file: *local_student_env
    ports: !override ["127.0.0.1:18005:8001"]     # the local Student portal calls it from the browser (live: 8005)
    networks: *local_net
    depends_on: *local_db
  student-attempt-service:
    image: portal-local/student-attempt-service:dev
    container_name: local-student-attempt-service
    env_file: *local_student_env
    ports: !override ["127.0.0.1:18006:8001"]     # the local Student portal calls it from the browser (live: 8006)
    networks: *local_net
    depends_on: *local_db
  student-result-service:
    image: portal-local/student-result-service:dev
    container_name: local-student-result-service
    env_file: *local_student_env
    ports: !override ["127.0.0.1:18007:8001"]     # the local Student portal calls it from the browser (live: 8007)
    networks: *local_net
    depends_on: *local_db
  student-ranking-service:
    image: portal-local/student-ranking-service:dev
    container_name: local-student-ranking-service
    env_file: *local_student_env
    ports: !override ["127.0.0.1:18008:8001"]     # the local Student portal calls it from the browser (live: 8008)
    networks: *local_net
    depends_on: *local_db
  student-notification-service:
    image: portal-local/student-notification-service:dev
    container_name: local-student-notification-service
    env_file: *local_student_env
    ports: !override ["127.0.0.1:18009:8001"]     # the local Student portal calls it from the browser (live: 8009)
    networks: *local_net
    depends_on: *local_db

  # The Student portal, built from this working tree against the LOCAL student services above (the browser calls each one
  # directly; the bundle's Content-Security-Policy is generated from these same origins). It reads only published papers.
  student-portal-frontend:
    build:
      context: ./student-frontend
      args: !override
        VITE_AUTH_API_URL: http://localhost:18002
        VITE_PROFILE_API_URL: http://localhost:18003
        VITE_ENROLLMENT_API_URL: http://localhost:18004
        VITE_TEST_API_URL: http://localhost:18005
        VITE_ATTEMPT_API_URL: http://localhost:18006
        VITE_RESULT_API_URL: http://localhost:18007
        VITE_RANKING_API_URL: http://localhost:18008
        VITE_NOTIFICATION_API_URL: http://localhost:18009
    image: portal-local/student-portal-frontend:dev
    container_name: local-student-portal-frontend
    ports: !override ["127.0.0.1:18080:80"]
    networks: *local_net

  institute-identity-service:
    image: portal-local/institute-identity-service:dev
    container_name: local-institute-identity-service
    env_file: *local_institute_env
    networks: *local_net
    depends_on: *local_db
  institute-organization-service:
    image: portal-local/institute-organization-service:dev
    container_name: local-institute-organization-service
    env_file: *local_institute_env
    networks: *local_net
  institute-academics-service:
    image: portal-local/institute-academics-service:dev
    container_name: local-institute-academics-service
    env_file: *local_institute_env
    networks: *local_net
  institute-enrollment-service:
    image: portal-local/institute-enrollment-service:dev
    container_name: local-institute-enrollment-service
    env_file: *local_institute_env
    networks: *local_net
  institute-paper-service:
    image: portal-local/institute-paper-service:dev
    container_name: local-institute-paper-service
    env_file: *local_institute_env
    networks: *local_net
  institute-exam-service:
    image: portal-local/institute-exam-service:dev
    container_name: local-institute-exam-service
    env_file: *local_institute_env
    networks: *local_net
  institute-exam-worker:
    image: portal-local/institute-exam-service:dev
    container_name: local-institute-exam-worker
    env_file: *local_institute_env
    networks: *local_net
  institute-operations-service:
    image: portal-local/institute-operations-service:dev
    container_name: local-institute-operations-service
    env_file: *local_institute_env
    networks: *local_net
  institute-gateway:
    image: portal-local/institute-gateway:dev
    container_name: local-institute-gateway
    ports: !override ["127.0.0.1:18010:80"]
    networks: *local_net
  institute-portal-frontend:
    build:
      args:
        VITE_INSTITUTE_API_URL: http://localhost:18010     # this instance's gateway, never the live one
    image: portal-local/institute-portal-frontend:dev
    container_name: local-institute-portal-frontend
    ports: !override ["127.0.0.1:18081:80"]

volumes:
  portal-local-pgdata:
