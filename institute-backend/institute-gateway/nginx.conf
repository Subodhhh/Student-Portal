# GENERATED by scripts/gen_gateway_conf.py from the services' route definitions. Do not edit by hand.
# One public origin for the Institute UI: the browser keeps talking to a single host (cookies, CORS, CSRF unchanged).

server {
    listen 80;
    server_name _;
    client_max_body_size 3m;   # paper uploads are limited to 2 MB by the paper service

    # Upstreams are resolved through Docker's embedded DNS at request time (not once at start-up), so a restarted or
    # recreated service with a new IP is reached again within `valid` seconds instead of answering 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $institute_identity institute-identity-service:8000;
    set $institute_organization institute-organization-service:8000;
    set $institute_academics institute-academics-service:8000;
    set $institute_enrollment institute-enrollment-service:8000;
    set $institute_paper institute-paper-service:8000;
    set $institute_exam institute-exam-service:8000;
    set $institute_operations institute-operations-service:8000;

    # Real client address: believed only from the demo edge, which sets X-Forwarded-For itself (deploy/tunnel).
    # Every other peer (the published port, other containers) keeps its own address, so nobody can spoof it.
    set_real_ip_from 10.231.47.2;
    real_ip_header X-Forwarded-For;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /health { default_type application/json; return 200 '{"status":"ok","service":"institute-gateway"}'; }
    # Service-to-service APIs are never reachable from outside.
    location ^~ /internal/ { return 404; }

    location ~ ^/api/v1/branches/[^/]+/subjects/[^/]+/papers/upload$ { proxy_pass http://$institute_paper; }
    location ~ ^/api/v1/auth/mfa/resend$ { proxy_pass http://$institute_identity; }
    location ~ ^/api/v1/auth/mfa/verify$ { proxy_pass http://$institute_identity; }
    location ~ ^/api/v1/branches/[^/]+/exam\-plans/check$ { proxy_pass http://$institute_exam; }
    location ~ ^/api/v1/branches/[^/]+/subjects/[^/]+/photo\-drafts$ { proxy_pass http://$institute_paper; }
    location ~ ^/api/v1/composite\-requests/[^/]+/slots/[^/]+/contribute$ { proxy_pass http://$institute_exam; }
    location ~ ^/api/v1/composite\-requests/[^/]+/slots/[^/]+/decline$ { proxy_pass http://$institute_exam; }
    location ~ ^/api/v1/exams/[^/]+/results/[^/]+/adjustments$ { proxy_pass http://$institute_exam; }
    location ~ ^/api/v1/global\-tests/[^/]+/occurrences/plan$ { proxy_pass http://$institute_exam; }
    location ~ ^/api/v1/global\-tests/[^/]+/occurrences/publish$ { proxy_pass http://$institute_exam; }
    location ~ ^/api/v1/photo\-drafts/[^/]+/files/order$ { proxy_pass http://$institute_paper; }
